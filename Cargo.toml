[package]
name = "skillguardai"
version = "0.1.0"
edition = "2021"
description = "SkillGuardAI — static, no-network security scanner for AI-agent skills and plugins"
license = "Apache-2.0"
authors = ["Sudarshan Chaudhari <sunny.sudarshan@gmail.com>"]
repository = "https://github.com/SUDARSHANCHAUDHARI/skillguardai"
homepage = "https://github.com/SUDARSHANCHAUDHARI/skillguardai"
readme = "README.md"
keywords = ["security", "scanner", "ai", "skills", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/docs", "/.superpowers"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
walkdir = "2"
serde_json = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
